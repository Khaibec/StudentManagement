<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="display-5 text-primary mb-2">
            <i class="bi bi-mortarboard-fill"></i>
          </div>
          <h3 class="fw-bold">Đăng Nhập</h3>
          <p class="text-muted small">Hệ thống Quản lý Học sinh & Khóa học</p>
        </div>

        <!-- Thông báo lỗi khi đăng nhập thất bại -->
        <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center mb-4" role="alert">
          <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2"></i>
          <div>{{ errorMessage }}</div>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <!-- Username -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Tên đăng nhập</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input
                type="text"
                class="form-control"
                placeholder="Nhập username (vd: admin, user)"
                formControlName="username"
                [ngClass]="{
                  'is-invalid': loginForm.get('username')?.touched && loginForm.get('username')?.invalid
                }"
              />
            </div>
            <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid" class="text-danger small mt-1">
              Tên đăng nhập không được để trống.
            </div>
          </div>

          <!-- Password -->
          <div class="mb-4">
            <label class="form-label fw-semibold">Mật khẩu</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input
                type="password"
                class="form-control"
                placeholder="Nhập mật khẩu"
                formControlName="password"
                [ngClass]="{
                  'is-invalid': loginForm.get('password')?.touched && loginForm.get('password')?.invalid
                }"
              />
            </div>
            <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-danger small mt-1">
              Mật khẩu không được để trống.
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" [disabled]="isLoading">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            <i *ngIf="!isLoading" class="bi bi-box-arrow-in-right me-1"></i>
            {{ isLoading ? 'Đang xử lý...' : 'Đăng Nhập' }}
          </button>
        </form>

        <!-- Quick Login Buttons for Learners -->
        <div class="mt-4 pt-3 border-top text-center">
          <p class="small text-muted mb-2">Tài khoản mẫu để thử nghiệm:</p>
          <div class="d-flex gap-2 justify-content-center">
            <button class="btn btn-outline-danger btn-sm" (click)="fillAdmin()">
              <i class="bi bi-shield-lock me-1"></i> Admin (Toàn quyền)
            </button>
            <button class="btn btn-outline-success btn-sm" (click)="fillUser()">
              <i class="bi bi-person me-1"></i> User (Chỉ xem)
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
