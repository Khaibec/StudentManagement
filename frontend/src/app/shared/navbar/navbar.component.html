<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" routerLink="/">
      <i class="bi bi-mortarboard-fill text-primary fs-4"></i>
      <span>StudentMS</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <!-- Menu điều hướng khi đã đăng nhập -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0" *ngIf="authService.isLoggedIn()">
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
            <i class="bi bi-speedometer2 me-1"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/students" routerLinkActive="active">
            <i class="bi bi-people me-1"></i> Học sinh
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/classes" routerLinkActive="active">
            <i class="bi bi-building me-1"></i> Lớp học
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/courses" routerLinkActive="active">
            <i class="bi bi-journal-bookmark me-1"></i> Môn học
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/enrollments" routerLinkActive="active">
            <i class="bi bi-pencil-square me-1"></i> Đăng ký môn
          </a>
        </li>
      </ul>

      <!-- Khối tài khoản bên phải -->
      <div class="d-flex align-items-center gap-3">
        <ng-container *ngIf="authService.isLoggedIn(); else guestTpl">
          <div class="text-light d-flex align-items-center gap-2">
            <i class="bi bi-person-circle fs-5 text-secondary"></i>
            <div>
              <span class="fw-semibold">{{ authService.currentUser()?.fullName }}</span>
              <span
                class="badge ms-2"
                [ngClass]="authService.isAdmin() ? 'badge-admin' : 'badge-user'"
              >
                {{ authService.currentUser()?.role }}
              </span>
            </div>
          </div>
          <button class="btn btn-outline-danger btn-sm" (click)="onLogout()">
            <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
          </button>
        </ng-container>

        <ng-template #guestTpl>
          <a routerLink="/login" class="btn btn-primary btn-sm">
            <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
          </a>
        </ng-template>
      </div>
    </div>
  </div>
</nav>
